name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: centralized validation
    uses: qtrpartners/jarvis-automation/.github/workflows/jarvis-ci.yml@5dc47e0df9e57ccfb2be9816f059e847f396187b
    permissions:
      contents: read
