name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: centralized validation
    uses: joshuamyers22/jarvis-automation/.github/workflows/jarvis-ci.yml@a130869d8bba3c419d1c0d72cb927a3ab319c033
    permissions:
      contents: read
