name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: "0.12.5"
      # Tests run against the local storage backend, so no provider extra is
      # needed to exercise job logic.
      # DAG integrity tests instantiate the GCP operator selected by the test
      # environment, so install that provider instead of silently skipping it.
      - run: uv sync --frozen --extra dev --extra gcp
      - run: uv run ruff check .
      - run: uv run mypy jobs ctl
      - run: uv run pytest -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.13.3"
      - run: terraform fmt -check -recursive terraform
      - name: Validate provider modules
        run: |
          for module in gcp gcp/network aws azure bootstrap/gcp live/gcp/dev live/gcp/stage live/gcp/prod; do
            terraform -chdir="terraform/$module" init -backend=false -input=false
            terraform -chdir="terraform/$module" validate
          done
      - name: Test GCP state bootstrap controls
        run: terraform -chdir=terraform/bootstrap/gcp test
      - name: Test GCP private network controls
        run: terraform -chdir=terraform/gcp/network test
      - name: Test GCP identity and IAM controls
        run: terraform -chdir=terraform/gcp test
      - name: Test AWS and Azure storage boundaries
        run: |
          terraform -chdir=terraform/aws test
          terraform -chdir=terraform/azure test
      - name: Test GCP live environment boundaries
        run: |
          for environment in dev stage prod; do
            terraform -chdir="terraform/live/gcp/$environment" test
          done

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan dependencies, secrets, and infrastructure
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # Build every provider image on pull requests as well as main. This job never
  # receives cloud credentials and never pushes an image.
  image-test:
    needs: [lint-and-test, terraform, security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: [gcp, aws, azure]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build clean provider image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          build-args: |
            CLOUD=${{ matrix.cloud }}
            VCS_REF=${{ github.sha }}
          tags: jarvis-ci:${{ matrix.cloud }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cloud }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cloud }}
      - name: Smoke all image roles
        run: scripts/smoke-image.sh jarvis-ci:${{ matrix.cloud }}-${{ github.sha }} ${{ matrix.cloud }}
      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: jarvis-ci:${{ matrix.cloud }}-${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.cloud }}.spdx.json
      - name: Upload image SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.cloud }}-${{ github.sha }}
          path: sbom-${{ matrix.cloud }}.spdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Scan provider image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: jarvis-ci:${{ matrix.cloud }}-${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # Publishing is deliberately separate from validation. Only a push to main
  # can obtain cloud identity or mutate a registry.
  publish:
    needs: [image-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        cloud: [gcp, aws, azure]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # --- provider login (only the configured one runs) --------------------
      - name: Auth to GCP
        if: matrix.cloud == 'gcp' && vars.GCP_IMAGE != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Auth to AWS
        if: matrix.cloud == 'aws' && vars.AWS_IMAGE != ''
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Auth to Azure
        if: matrix.cloud == 'azure' && vars.AZURE_IMAGE != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve image name
        id: img
        run: |
          case "${{ matrix.cloud }}" in
            gcp)   echo "image=${{ vars.GCP_IMAGE }}"   >> "$GITHUB_OUTPUT" ;;
            aws)   echo "image=${{ vars.AWS_IMAGE }}"   >> "$GITHUB_OUTPUT" ;;
            azure) echo "image=${{ vars.AZURE_IMAGE }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Registry login
        if: steps.img.outputs.image != ''
        run: |
          host="$(echo '${{ steps.img.outputs.image }}' | cut -d/ -f1)"
          case "${{ matrix.cloud }}" in
            gcp)   gcloud auth configure-docker "$host" --quiet ;;
            aws)   aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
                     | docker login --username AWS --password-stdin "$host" ;;
            azure) az acr login --name "${host%%.*}" ;;
          esac

      - name: Build and push
        if: steps.img.outputs.image != ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            CLOUD=${{ matrix.cloud }}
            VCS_REF=${{ github.sha }}
          # Publish only the immutable SHA; GitHub Actions stores layer caches.
          tags: |
            ${{ steps.img.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cloud }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cloud }}
          provenance: mode=max
          sbom: true
