name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: centralized validation
    uses: joshuamyers22/jarvis-automation/.github/workflows/jarvis-ci.yml@7f92350563685092549b651bdeed4ad1d38e46c5
    permissions:
      contents: read
