name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: "0.12.5"
      # Tests run against the local storage backend, so no provider extra is
      # needed to exercise job logic.
      # DAG integrity tests instantiate the GCP operator selected by the test
      # environment, so install that provider instead of silently skipping it.
      - run: uv sync --frozen --extra dev --extra gcp
      - run: uv run ruff check .
      - run: uv run mypy jobs ctl scripts/data_ownership.py scripts/gcp_recovery_drill.py
      - run: uv run python scripts/data-ownership.py check
      - run: bash -n docker/entrypoint.sh scripts/smoke-image.sh
      - run: uv run pytest -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
      - run: terraform fmt -check -recursive terraform
      - name: Validate provider modules
        run: |
          for module in gcp gcp/network aws azure bootstrap/gcp live/gcp/dev live/gcp/stage live/gcp/prod; do
            terraform -chdir="terraform/$module" init -backend=false -input=false
            terraform -chdir="terraform/$module" validate
          done

      - name: Test GCP state bootstrap controls
        run: terraform -chdir=terraform/bootstrap/gcp test
      - name: Test GCP private network controls
        run: terraform -chdir=terraform/gcp/network test
      - name: Test GCP identity and IAM controls
        run: terraform -chdir=terraform/gcp test
      - name: Test AWS and Azure storage boundaries
        run: |
          terraform -chdir=terraform/aws test
          terraform -chdir=terraform/azure test
      - name: Test GCP live environment boundaries
        run: |
          for environment in dev stage prod; do
            terraform -chdir="terraform/live/gcp/$environment" test
          done

  host-image-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.16.0"
      - run: packer init packer/gcp
      - run: packer fmt -check packer/gcp
      - run: packer validate -var-file=packer/gcp/ci.pkrvars.hcl packer/gcp
      - run: bash -n scripts/build-gcp-host-image.sh packer/gcp/files/jarvis-compose packer/gcp/scripts/*.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan dependencies, secrets, and infrastructure
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # Build every provider image on pull requests as well as main. This job never
  # receives cloud credentials and never pushes an image.
  image-test:
    needs: [lint-and-test, terraform, host-image-template, security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: [gcp, aws, azure]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build clean provider image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          build-args: |
            CLOUD=${{ matrix.cloud }}
            VCS_REF=${{ github.sha }}
          tags: jarvis-ci:${{ matrix.cloud }}-${{ github.sha }}
          # Validation and release never share writable cache namespaces.
          cache-from: type=gha,scope=validation-${{ matrix.cloud }}
          cache-to: type=gha,mode=max,scope=validation-${{ matrix.cloud }}
      - name: Smoke all image roles
        run: scripts/smoke-image.sh jarvis-ci:${{ matrix.cloud }}-${{ github.sha }} ${{ matrix.cloud }}
      - name: Generate image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: jarvis-ci:${{ matrix.cloud }}-${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.cloud }}.spdx.json
      - name: Upload image SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.cloud }}-${{ github.sha }}
          path: sbom-${{ matrix.cloud }}.spdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Scan provider image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: jarvis-ci:${{ matrix.cloud }}-${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
