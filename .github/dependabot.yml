version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: terraform
    directory: "/terraform/gcp"
    schedule:
      interval: monthly
  - package-ecosystem: terraform
    directory: "/terraform/aws"
    schedule:
      interval: monthly
  - package-ecosystem: terraform
    directory: "/terraform/azure"
    schedule:
      interval: monthly
