version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: terraform
    directory: "/terraform/gcp"
    schedule:
      interval: monthly
    # A Google provider major must be upgraded across the shared module,
    # network, bootstrap, and all live roots as one coordinated change.
    ignore:
      - dependency-name: hashicorp/google
        update-types: ["version-update:semver-major"]
  - package-ecosystem: terraform
    directory: "/terraform/aws"
    schedule:
      interval: monthly
  - package-ecosystem: terraform
    directory: "/terraform/azure"
    schedule:
      interval: monthly
