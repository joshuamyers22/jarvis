[project]
name = "research-platform"
version = "0.1.0"
description = "Self-hosted research and batch platform: one image, many roles."
requires-python = ">=3.12,<3.13"

# Provider SDKs are NOT here. They live in extras so the image contains one
# cloud's stack rather than three -- see [project.optional-dependencies].
dependencies = [
  # --- orchestration -------------------------------------------------------
  "apache-airflow==3.0.*",
  "apache-airflow-providers-postgres>=6.0.0",
  # --- data ----------------------------------------------------------------
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16.0",
  "duckdb>=1.0",
  # --- storage (provider-neutral) ------------------------------------------
  "fsspec>=2024.6.0",
  # --- io ------------------------------------------------------------------
  "httpx>=0.27",
  "websockets>=12.0",
  "tenacity>=8.3",
  # --- config / cli --------------------------------------------------------
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  # --- interactive ---------------------------------------------------------
  "jupyterlab>=4.2",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
gcp = [
  "apache-airflow-providers-google>=12.0.0",
  "gcsfs>=2024.6.0",
  "google-cloud-storage>=2.17",
  "google-cloud-secret-manager>=2.20",
]
aws = [
  "apache-airflow-providers-amazon>=9.0.0",
  "s3fs>=2024.6.0",
  "boto3>=1.34",
]
azure = [
  "apache-airflow-providers-microsoft-azure>=11.0.0",
  "adlfs>=2024.4.1",
  "azure-identity>=1.17",
  "azure-keyvault-secrets>=4.8",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
ctl = "ctl.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobs", "ctl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
